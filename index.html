<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Отчёты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c12;--cy:#25f4ee;--pk:#fe2c55;--mut:#6e6e7a;--line:#e6e6ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:500 16px/1.45 Manrope,system-ui,"Segoe UI",sans-serif;color:#fff;background:var(--ink)}
.hidden{display:none!important}
h1,h2,.logo{font-family:Unbounded,Manrope,sans-serif;font-weight:600;letter-spacing:-.02em}
h1,h2{margin:0 0 4px;font-size:22px}
small,.mut{color:var(--mut)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 70px}
#auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:#fff;color:var(--ink);border-radius:14px;padding:24px}
#regForm{width:100%;max-width:400px;box-shadow:-6px -6px 0 var(--cy),6px 6px 0 var(--pk)}
label{display:block;margin-top:14px;font-size:13px;font-weight:700}
input{width:100%;margin-top:6px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#f7f7fb;outline:0}
input:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(37,244,238,.55)}
button{font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.btn{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;color:#fff;background:var(--ink)}
.btn.main{width:100%;box-shadow:-3px -3px 0 var(--cy),3px 3px 0 var(--pk)}
.btn.ok{background:#12875a}.btn.no{background:#d92d20}.btn.ghost{background:#eceef3;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.err,.okm{margin:12px 0 0;min-height:1.2em;font-size:14px;color:#d92d20}.okm{color:#12875a}
.menu{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:#fff;color:var(--ink);border-bottom:3px solid var(--pk)}
.logo{font-size:16px}.logo span{color:var(--pk);margin-left:4px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button,.sub button{border:0;background:none;padding:9px 14px;border-radius:8px;color:var(--mut)}
nav button.on{background:var(--ink);color:#fff}
.who{display:flex;flex-direction:column;text-align:right;line-height:1.25}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.list{display:grid;gap:12px}
.rep{background:#fff;color:var(--ink);border-radius:12px;padding:16px;border-left:5px solid var(--line)}
.rep.approved{border-color:#12875a}.rep.rejected{border-color:#d92d20}.rep.pending{border-color:#f5b301}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#fff1c2;color:#7a5600}
.badge.approved{background:#d3f5e3;color:#0b5c3b}.badge.rejected{background:#fde2df;color:#8f1d14}
.badge.r-owner{background:#ffe0e8;color:#9c1239}.badge.r-admin{background:#dbe8ff;color:#1b3f9e}.badge.r-user{background:#eceef3;color:#444}
.lnk{display:block;margin:10px 0;word-break:break-all;color:#0a5fd6;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.stats li{flex:1 1 90px;background:#f4f4f8;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:17px;color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{margin-top:12px}
code{background:#eceef3;padding:2px 7px;border-radius:6px;font-size:13px}
.by{margin-bottom:4px}
.sub{display:flex;gap:6px;margin-bottom:14px}.sub button{background:#1d1d27;color:#fff}.sub button.on{background:#fff;color:var(--ink)}
.h{margin:0 0 14px}.empty{color:#9a9aa6;text-align:center;padding:36px 0}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:9;text-align:center;padding:24px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#a4140a;padding:12px 18px;border-radius:10px;font-weight:700;display:none;z-index:10;max-width:92vw}
#toast.on{display:block}
</style>
</head>
<body>
<main id="auth" class="hidden">
  <form id="regForm" class="card">
    <h1>Регистрация</h1>
    <p class="mut">Введите свой ID и ник, чтобы войти.</p>
    <label>ID<input id="rid" placeholder="например 10001355" maxlength="20" autocomplete="off" required></label>
    <label>Ник<input id="rnick" placeholder="Ваш ник" maxlength="20" autocomplete="off" required></label>
    <button class="btn main" id="regBtn">Зарегистрироваться</button>
    <p class="err" id="regErr"></p>
  </form>
</main>
<div id="app" class="hidden">
  <header class="menu"><b class="logo">Отчёты<span>TikTok</span></b><nav id="nav"></nav><div class="who" id="who"></div></header>
  <main class="wrap" id="view"></main>
</div>
<div id="boot">Загрузка…</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, orderBy, limit, onSnapshot, addDoc, updateDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ROLE = { owner: "Владелец", admin: "Админ", user: "Пользователь" };
const STAT = { pending: "На проверке", approved: "Принят", rejected: "Отклонён" };
const F = [["likes", "Лайки", "400"], ["comments", "Комментарии", "25"], ["favorites", "Избранное", "10"], ["reposts", "Репосты", "5"], ["views", "Просмотры", "5000"]];
const URL_RE = /^https:\/\/([a-zA-Z0-9-]+\.)*tiktok\.com\/\S*$/;
let uid, me, tab = "report", sub = "r", unsubs = [];

const stop = () => { unsubs.forEach(f => f()); unsubs = []; };
const staff = () => me && (me.role === "admin" || me.role === "owner");
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 4500); };
const fail = e => toast("Ошибка: " + (e.code || e.message));
const num = n => Number(n).toLocaleString("ru-RU");
const when = t => (t && t.toDate ? t.toDate().toLocaleString("ru-RU") : "…");

/* ---------- вход ---------- */
onAuthStateChanged(auth, u => {
  if (!u) {
    signInAnonymously(auth).catch(e => {
      $("#boot").innerHTML = "Ошибка входа: " + esc(e.code) + "<br>Включите Anonymous в Firebase → Authentication и проверьте firebase-config.js";
    });
    return;
  }
  uid = u.uid;
  onSnapshot(doc(db, "users", uid), s => {
    $("#boot").classList.add("hidden");
    if (!s.exists()) { me = null; stop(); $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden"); return; }
    me = s.data();
    $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden");
    shell();
  }, e => { $("#boot").classList.remove("hidden"); $("#boot").textContent = "Ошибка: " + e.code + ". Опубликуйте правила Firestore (см. README)."; });
});

$("#regForm").onsubmit = async e => {
  e.preventDefault();
  const id = $("#rid").value.trim(), nick = $("#rnick").value.trim(), err = $("#regErr"), btn = $("#regBtn");
  err.textContent = "";
  if (!/^[A-Za-z0-9_-]{2,20}$/.test(id)) return void (err.textContent = "ID: 2–20 символов — буквы, цифры, _ и -");
  if (nick.length < 2 || nick.length > 20) return void (err.textContent = "Ник: от 2 до 20 символов");
  btn.disabled = true;
  try {
    const b = writeBatch(db);
    b.set(doc(db, "ids", id), { uid });
    b.set(doc(db, "users", uid), { gameId: id, nick, role: id === "Dev" ? "owner" : "user" });
    await b.commit();
  } catch (x) {
    let taken = false;
    try { taken = (await getDoc(doc(db, "ids", id))).exists(); } catch (_) {}
    err.textContent = taken ? "Этот ID уже занят" : /^dev$/i.test(id) ? "Этот ID недоступен" : "Не удалось зарегистрироваться: " + x.code;
  }
  btn.disabled = false;
};

/* ---------- меню ---------- */
function shell() {
  const tabs = [["report", "Отчёт"], ["mine", "Мои отчёты"]];
  if (staff()) tabs.push(["admin", "Админ-панель"]);
  if (!tabs.some(t => t[0] === tab)) tab = "report";
  $("#nav").innerHTML = tabs.map(([k, t]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${t}</button>`).join("");
  $("#who").innerHTML = `<b>${esc(me.nick)}</b><small>ID ${esc(me.gameId)} · ${ROLE[me.role]}</small>`;
  show();
}
$("#nav").onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; shell(); } };

function show() {
  stop();
  const v = $("#view"); v.onclick = null;
  if (tab === "report") reportView(v); else if (tab === "mine") mineView(v); else adminView(v);
}

/* ---------- карточка отчёта ---------- */
function card(r, admin) {
  return `<article class="rep ${r.status}">
    <div class="top">${admin ? `<span class="by"><b>${esc(r.nick)}</b> <code>ID ${esc(r.gameId)}</code></span>` : `<small>${when(r.createdAt)}</small>`}<span class="badge ${r.status}">${STAT[r.status]}</span></div>
    ${admin ? `<small>${when(r.createdAt)}</small>` : ""}
    <a class="lnk" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a>
    <ul class="stats">${F.map(([k, t]) => `<li><b>${num(r[k])}</b>${t}</li>`).join("")}</ul>
    ${admin ? `<div class="acts"><button class="btn ok" data-a="approved" data-id="${r.id}" ${r.status === "approved" ? "disabled" : ""}>Принять</button><button class="btn no" data-a="rejected" data-id="${r.id}" ${r.status === "rejected" ? "disabled" : ""}>Отклонить</button></div>${r.reviewedBy ? `<small>Проверил: ID ${esc(r.reviewedBy)}</small>` : ""}` : ""}
  </article>`;
}

/* ---------- отчёт ---------- */
function reportView(v) {
  v.innerHTML = `<form class="card" id="rf"><h2>Новый отчёт</h2><p class="mut">Вставьте ссылку на видео и укажите, сколько получено.</p>
    <label>Ссылка на видео TikTok<input id="ru" type="url" placeholder="https://vt.tiktok.com/ZSpMfVGeE/" required></label>
    <div class="grid">${F.map(([k, t, p]) => `<label>${t}<input id="f_${k}" type="number" min="0" inputmode="numeric" placeholder="${p}"></label>`).join("")}</div>
    <button class="btn main">Отправить отчёт</button><p id="rm" class="err"></p></form>`;
  $("#rf").onsubmit = async e => {
    e.preventDefault();
    const m = $("#rm"); m.className = "err"; m.textContent = "";
    const url = $("#ru").value.trim();
    if (url.length > 300 || !URL_RE.test(url)) return void (m.textContent = "Вставьте ссылку вида https://vt.tiktok.com/…");
    const d = {};
    for (const [k] of F) {
      const n = Number($("#f_" + k).value || 0);
      if (!Number.isInteger(n) || n < 0 || n > 1e9) return void (m.textContent = "Числа должны быть целыми, от 0");
      d[k] = n;
    }
    if (!Object.values(d).some(n => n > 0)) return void (m.textContent = "Укажите хотя бы одно число");
    try {
      await addDoc(collection(db, "reports"), { uid, gameId: me.gameId, nick: me.nick, url, ...d, status: "pending", createdAt: serverTimestamp() });
      $("#rf").reset(); m.className = "okm"; m.textContent = "Отчёт отправлен";
    } catch (x) { m.textContent = "Не удалось отправить: " + x.code; }
  };
}

/* ---------- мои отчёты ---------- */
function mineView(v) {
  v.innerHTML = `<h2 class="h">Мои отчёты</h2><div id="list" class="list"></div>`;
  unsubs.push(onSnapshot(query(collection(db, "reports"), where("uid", "==", uid)), s => {
    const rows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds ?? 9e12) - (a.createdAt?.seconds ?? 9e12));
    $("#list").innerHTML = rows.map(r => card(r, false)).join("") || `<p class="empty">Отчётов пока нет. Отправьте первый во вкладке «Отчёт».</p>`;
  }, fail));
}

/* ---------- админ-панель ---------- */
const rb = (u, r, t, c) => `<button class="btn ${c}" data-r="${r}" data-u="${u.uid}">${t}</button>`;
const userRow = u => `<article class="rep"><div class="top"><span><b>${esc(u.nick)}</b> <code>ID ${esc(u.gameId)}</code></span><span class="badge r-${u.role}">${ROLE[u.role]}</span></div>${u.uid === uid ? `<small>Это вы</small>` : `<div class="acts">${u.role === "admin" ? rb(u, "user", "Снять админа", "no") : rb(u, "admin", "Назначить админом", "ok")}${rb(u, "owner", "Передать владельца", "ghost")}</div>`}</article>`;

function adminView(v) {
  const owner = me.role === "owner";
  if (!owner) sub = "r";
  v.innerHTML = `<div class="sub"><button data-s="r" class="${sub === "r" ? "on" : ""}">Отчёты</button>${owner ? `<button data-s="u" class="${sub === "u" ? "on" : ""}">Пользователи</button>` : ""}</div><div id="list" class="list"></div>`;
  v.onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    try {
      if (d.s) { sub = d.s; show(); }
      else if (d.a) await updateDoc(doc(db, "reports", d.id), { status: d.a, reviewedBy: me.gameId });
      else if (d.r === "owner") {
        if (!confirm("Передать владельца этому пользователю? Вы станете админом.")) return;
        const w = writeBatch(db);
        w.update(doc(db, "users", d.u), { role: "owner" });
        w.update(doc(db, "users", uid), { role: "admin" });
        await w.commit();
      } else if (d.r) await updateDoc(doc(db, "users", d.u), { role: d.r });
    } catch (x) { fail(x); }
  };
  const L = h => { $("#list").innerHTML = h; };
  if (sub === "r") {
    unsubs.push(onSnapshot(query(collection(db, "reports"), orderBy("createdAt", "desc"), limit(200)),
      s => L(s.docs.map(d => card({ id: d.id, ...d.data() }, true)).join("") || `<p class="empty">Отчётов пока нет</p>`), fail));
  } else {
    unsubs.push(onSnapshot(collection(db, "users"),
      s => L(s.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => a.gameId.localeCompare(b.gameId, "ru", { numeric: true })).map(userRow).join("")), fail));
  }
}
</script>
</body>
</html>
